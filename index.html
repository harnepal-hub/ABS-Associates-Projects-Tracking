<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Project Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-compass-drafting text-indigo-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">ArchTracker <span class="text-xs text-indigo-400 font-normal ml-2">v1.0</span></h1>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> New Deliverable
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- Overview Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Total Tasks</p>
        <p id="stat-total" class="text-2xl font-bold mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">In Progress</p>
        <p id="stat-progress" class="text-2xl font-bold text-blue-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Overdue</p>
        <p id="stat-overdue" class="text-2xl font-bold text-rose-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase font-semibold">Closed / Done</p>
        <p id="stat-completed" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
      </div>
    </div>

    <!-- Controls / Filters -->
    <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
        <input type="text" id="filter-search" oninput="renderTasks()" placeholder="Search drawing / task..." class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2 w-full sm:w-60 focus:outline-none focus:border-indigo-500">
        
        <select id="filter-status" onchange="renderTasks()" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2 focus:outline-none">
          <option value="ALL">All Statuses</option>
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Client Review">Client Review</option>
          <option value="Revision Needed">Revision Needed</option>
          <option value="Closed">Closed</option>
        </select>

        <select id="filter-role" onchange="renderTasks()" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2 focus:outline-none">
          <option value="ALL">All Roles</option>
          <option value="Principal Architect">Principal Architect</option>
          <option value="Junior Architect">Junior Architect</option>
          <option value="Draftsman">Draftsman</option>
          <option value="Structural Consultant">Structural Consultant</option>
          <option value="MEP Consultant">MEP Consultant</option>
          <option value="3D Visualizer">3D Visualizer</option>
          <option value="Site Engineer">Site Engineer</option>
        </select>
      </div>
    </div>

    <!-- Task Table -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-x-auto shadow-md">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-slate-900/60 text-slate-400 uppercase text-xs border-b border-slate-700">
          <tr>
            <th class="p-4">Project & Deliverable</th>
            <th class="p-4">Assigned To</th>
            <th class="p-4">Phase</th>
            <th class="p-4">Deadline</th>
            <th class="p-4">Status</th>
            <th class="p-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="task-list" class="divide-y divide-slate-700/50">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal for Task Form -->
  <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 id="modal-title" class="text-lg font-semibold">Add New Architectural Task</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="task-form" onsubmit="saveTask(event)" class="space-y-4">
        <input type="hidden" id="task-id">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Project Name</label>
            <input type="text" id="project-name" required placeholder="e.g., Beach Villa - Vizag" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Phase</label>
            <select id="project-phase" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
              <option value="Concept Design">Concept Design</option>
              <option value="Schematic Approval">Schematic Approval</option>
              <option value="Working Drawings">Working Drawings</option>
              <option value="Statutory Approvals">Statutory Approvals</option>
              <option value="3D Rendering">3D Rendering</option>
              <option value="Site Execution">Site Execution</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Deliverable / Drawing Task</label>
          <input type="text" id="task-title" required placeholder="e.g., First Floor Electrical Layout" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Assigned Person</label>
            <input type="text" id="assignee-name" required placeholder="Name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Role</label>
            <select id="assignee-role" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
              <option value="Principal Architect">Principal Architect</option>
              <option value="Junior Architect">Junior Architect</option>
              <option value="Draftsman">Draftsman</option>
              <option value="Structural Consultant">Structural Consultant</option>
              <option value="MEP Consultant">MEP Consultant</option>
              <option value="3D Visualizer">3D Visualizer</option>
              <option value="Site Engineer">Site Engineer</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Deadline</label>
            <input type="date" id="task-deadline" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
            <select id="task-status" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Client Review">Client Review</option>
              <option value="Revision Needed">Revision Needed</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Drawing / Cloud Link (Optional)</label>
          <input type="url" id="task-link" placeholder="https://drive.google.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-700 hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 font-medium rounded-lg text-white">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('arch_tasks')) || [];

    function saveTasksToStorage() {
      localStorage.setItem('arch_tasks', JSON.stringify(tasks));
    }

    function openModal(editId = null) {
      document.getElementById('task-form').reset();
      document.getElementById('task-id').value = '';
      document.getElementById('modal-title').innerText = 'Add New Architectural Task';

      if (editId) {
        const task = tasks.find(t => t.id === editId);
        if (task) {
          document.getElementById('modal-title').innerText = 'Edit Task';
          document.getElementById('task-id').value = task.id;
          document.getElementById('project-name').value = task.project;
          document.getElementById('project-phase').value = task.phase;
          document.getElementById('task-title').value = task.title;
          document.getElementById('assignee-name').value = task.assignee;
          document.getElementById('assignee-role').value = task.role;
          document.getElementById('task-deadline').value = task.deadline;
          document.getElementById('task-status').value = task.status;
          document.getElementById('task-link').value = task.link || '';
        }
      }
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const taskData = {
        id: id ? parseInt(id) : Date.now(),
        project: document.getElementById('project-name').value,
        phase: document.getElementById('project-phase').value,
        title: document.getElementById('task-title').value,
        assignee: document.getElementById('assignee-name').value,
        role: document.getElementById('assignee-role').value,
        deadline: document.getElementById('task-deadline').value,
        status: document.getElementById('task-status').value,
        link: document.getElementById('task-link').value
      };

      if (id) {
        tasks = tasks.map(t => t.id === parseInt(id) ? taskData : t);
      } else {
        tasks.push(taskData);
      }

      saveTasksToStorage();
      closeModal();
      renderTasks();
    }

    function deleteTask(id) {
      if (confirm('Are you sure you want to delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasksToStorage();
        renderTasks();
      }
    }

    function renderTasks() {
      const tbody = document.getElementById('task-list');
      const search = document.getElementById('filter-search').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      const roleFilter = document.getElementById('filter-role').value;

      tbody.innerHTML = '';

      const todayStr = new Date().toISOString().split('T')[0];

      let filtered = tasks.filter(t => {
        const matchesSearch = t.project.toLowerCase().includes(search) || t.title.toLowerCase().includes(search) || t.assignee.toLowerCase().includes(search);
        const matchesStatus = statusFilter === 'ALL' || t.status === statusFilter;
        const matchesRole = roleFilter === 'ALL' || t.role === roleFilter;
        return matchesSearch && matchesStatus && matchesRole;
      });

      // Update Dashboard Stats
      document.getElementById('stat-total').innerText = tasks.length;
      document.getElementById('stat-progress').innerText = tasks.filter(t => t.status === 'In Progress').length;
      document.getElementById('stat-completed').innerText = tasks.filter(t => t.status === 'Closed').length;
      document.getElementById('stat-overdue').innerText = tasks.filter(t => t.deadline < todayStr && t.status !== 'Closed').length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">No tasks found. Click "+ New Deliverable" to add one.</td></tr>`;
        return;
      }

      filtered.forEach(task => {
        const isOverdue = task.deadline < todayStr && task.status !== 'Closed';
        
        let statusBadge = '';
        switch(task.status) {
          case 'Closed': statusBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'; break;
          case 'In Progress': statusBadge = 'bg-blue-500/10 text-blue-400 border-blue-500/20'; break;
          case 'Client Review': statusBadge = 'bg-purple-500/10 text-purple-400 border-purple-500/20'; break;
          case 'Revision Needed': statusBadge = 'bg-amber-500/10 text-amber-400 border-amber-500/20'; break;
          default: statusBadge = 'bg-slate-700 text-slate-300 border-slate-600';
        }

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 transition-colors';
        tr.innerHTML = `
          <td class="p-4">
            <div class="font-semibold text-slate-100">${task.project}</div>
            <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
              <span>${task.title}</span>
              ${task.link ? `<a href="${task.link}" target="_blank" class="text-indigo-400 hover:underline"><i class="fa-solid fa-paperclip"></i> Link</a>` : ''}
            </div>
          </td>
          <td class="p-4">
            <div class="font-medium text-slate-200">${task.assignee}</div>
            <div class="text-xs text-slate-400">${task.role}</div>
          </td>
          <td class="p-4">
            <span class="text-xs bg-slate-900 border border-slate-700 px-2 py-1 rounded-md text-slate-300">${task.phase}</span>
          </td>
          <td class="p-4">
            <div class="${isOverdue ? 'text-rose-400 font-semibold' : 'text-slate-300'} text-xs">
              ${task.deadline} ${isOverdue ? '<i class="fa-solid fa-triangle-exclamation ml-1" title="Overdue"></i>' : ''}
            </div>
          </td>
          <td class="p-4">
            <span class="text-xs px-2.5 py-1 rounded-full border ${statusBadge} font-medium">${task.status}</span>
          </td>
          <td class="p-4 text-right space-x-2">
            <button onclick="openModal(${task.id})" class="text-slate-400 hover:text-indigo-400 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-rose-400 p-1"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initial render
    renderTasks();
  </script>
</body>
</html>
