<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABS Associates - Architecture Project Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Trello-like Font (Charlie Text / Inter / Segoe UI) -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Noto Sans, Ubuntu, Droid Sans, "Helvetica Neue", sans-serif;
    }
  </style>
</head>
<body class="bg-[#F4F5F7] text-[#172B4D] min-h-screen">

  <!-- Trello-style Header Bar -->
  <header class="bg-[#0052CC] text-white p-3.5 sticky top-0 z-10 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-trello text-xl text-white/90"></i>
        <div>
          <h1 class="text-lg font-bold leading-tight">ABS Associates</h1>
          <p class="text-xs text-blue-100 font-normal">Architecture Project & Deliverable Tracker</p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-white/20 hover:bg-white/30 text-white px-3.5 py-1.5 rounded-md font-medium text-sm transition-all flex items-center gap-2 backdrop-blur-sm">
        <i class="fa-solid fa-plus text-xs"></i> New Task
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-5">

    <!-- Overview Stat Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white border border-[#DFE1E6] p-4 rounded-lg shadow-sm">
        <p class="text-xs text-[#5E6C84] uppercase font-bold tracking-wider">Total Tasks</p>
        <p id="stat-total" class="text-2xl font-bold mt-1 text-[#172B4D]">0</p>
      </div>
      <div class="bg-white border border-[#DFE1E6] p-4 rounded-lg shadow-sm">
        <p class="text-xs text-[#5E6C84] uppercase font-bold tracking-wider">In Progress</p>
        <p id="stat-progress" class="text-2xl font-bold text-[#0052CC] mt-1">0</p>
      </div>
      <div class="bg-white border border-[#DFE1E6] p-4 rounded-lg shadow-sm">
        <p class="text-xs text-[#5E6C84] uppercase font-bold tracking-wider">Overdue</p>
        <p id="stat-overdue" class="text-2xl font-bold text-[#DE350B] mt-1">0</p>
      </div>
      <div class="bg-white border border-[#DFE1E6] p-4 rounded-lg shadow-sm">
        <p class="text-xs text-[#5E6C84] uppercase font-bold tracking-wider">Closed / Done</p>
        <p id="stat-completed" class="text-2xl font-bold text-[#00875A] mt-1">0</p>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="bg-white border border-[#DFE1E6] p-3.5 rounded-lg flex flex-wrap gap-3 items-center justify-between shadow-sm">
      <div class="flex flex-wrap gap-3 items-center w-full md:w-auto">
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-[#6B778C] text-xs"></i>
          <input type="text" id="filter-search" oninput="renderTasks()" placeholder="Search project, task, assignee..." class="bg-[#FAFBFC] border border-[#DFE1E6] text-sm rounded-md pl-8 pr-3 py-1.5 w-full focus:outline-none focus:border-[#0052CC] focus:bg-white text-[#172B4D]">
        </div>
        
        <select id="filter-status" onchange="renderTasks()" class="bg-[#FAFBFC] border border-[#DFE1E6] text-sm rounded-md px-3 py-1.5 focus:outline-none focus:border-[#0052CC] text-[#172B4D]">
          <option value="ALL">All Statuses</option>
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Client Review">Client Review</option>
          <option value="Revision Needed">Revision Needed</option>
          <option value="Closed">Closed</option>
        </select>

        <select id="filter-role" onchange="renderTasks()" class="bg-[#FAFBFC] border border-[#DFE1E6] text-sm rounded-md px-3 py-1.5 focus:outline-none focus:border-[#0052CC] text-[#172B4D]">
          <option value="ALL">All Roles</option>
          <option value="Principal Architect">Principal Architect</option>
          <option value="Junior Architect">Junior Architect</option>
          <option value="Draftsman">Draftsman</option>
          <option value="Structural Consultant">Structural Consultant</option>
          <option value="MEP Consultant">MEP Consultant</option>
          <option value="3D Visualizer">3D Visualizer</option>
          <option value="Site Engineer">Site Engineer</option>
        </select>
      </div>

      <div class="text-xs text-[#5E6C84] flex items-center gap-2 font-medium">
        <span class="inline-block w-2 h-2 rounded-full bg-[#36B37E] animate-pulse"></span>
        Realtime Sync Active
      </div>
    </div>

    <!-- Task & Drawing Deliverables Table -->
    <div class="bg-white border border-[#DFE1E6] rounded-lg overflow-x-auto shadow-sm">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-[#FAFBFC] text-[#5E6C84] uppercase text-[11px] font-bold border-b border-[#DFE1E6]">
          <tr>
            <th class="p-3.5">Project & Deliverable</th>
            <th class="p-3.5">Assigned To</th>
            <th class="p-3.5">Phase</th>
            <th class="p-3.5">Deadline</th>
            <th class="p-3.5">Status</th>
            <th class="p-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="task-list" class="divide-y divide-[#DFE1E6]">
          <!-- Dynamically Populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-[#091E42]/60 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-[#DFE1E6] rounded-lg max-w-lg w-full p-6 space-y-4 shadow-xl text-[#172B4D]">
      <div class="flex justify-between items-center border-b border-[#DFE1E6] pb-3">
        <h3 id="modal-title" class="text-base font-bold text-[#091E42]">Add New Architecture Task</h3>
        <button onclick="closeModal()" class="text-[#6B778C] hover:text-[#091E42]"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="task-form" onsubmit="saveTask(event)" class="space-y-4">
        <input type="hidden" id="task-id">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Project Name *</label>
            <input type="text" id="project-name" required placeholder="e.g. Visakhapatnam Residence" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC] focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Architectural Phase</label>
            <select id="project-phase" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC]">
              <option value="Concept Design">Concept Design</option>
              <option value="Schematic Approval">Schematic Approval</option>
              <option value="Working Drawings">Working Drawings</option>
              <option value="Statutory Approvals">Statutory Approvals</option>
              <option value="3D Rendering">3D Rendering</option>
              <option value="Site Execution">Site Execution</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Task / Deliverable Title *</label>
          <input type="text" id="task-title" required placeholder="e.g. Column Layout & Framing Plan" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC] focus:bg-white">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Assignee Name *</label>
            <input type="text" id="assignee-name" required placeholder="Person Name" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC] focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Role</label>
            <select id="assignee-role" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC]">
              <option value="Principal Architect">Principal Architect</option>
              <option value="Junior Architect">Junior Architect</option>
              <option value="Draftsman">Draftsman</option>
              <option value="Structural Consultant">Structural Consultant</option>
              <option value="MEP Consultant">MEP Consultant</option>
              <option value="3D Visualizer">3D Visualizer</option>
              <option value="Site Engineer">Site Engineer</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Target Deadline *</label>
            <input type="date" id="task-deadline" required class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Current Status</label>
            <select id="task-status" class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC]">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Client Review">Client Review</option>
              <option value="Revision Needed">Revision Needed</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#5E6C84] mb-1">Drawing / Storage Link (Optional)</label>
          <input type="url" id="task-link" placeholder="https://drive.google.com/..." class="w-full bg-[#FAFBFC] border border-[#DFE1E6] rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-[#0052CC] focus:bg-white">
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-[#DFE1E6]">
          <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 text-sm rounded-md border border-[#DFE1E6] hover:bg-[#FAFBFC] text-[#091E42] font-medium">Cancel</button>
          <button type="submit" id="submit-btn" class="px-3.5 py-1.5 text-sm bg-[#0052CC] hover:bg-[#0065FF] font-medium rounded-md text-white shadow-xs">Save Deliverable</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Embedded Supabase Credentials
    const SUPABASE_URL = 'https://ldlujmpgyqamksqjzccy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SNU5aOt50T7EOdJV86BeRQ_hJRy6oAC';

    let supabaseClient = null;
    let tasks = [];

    function initSupabase() {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function initRealtimeData() {
      initSupabase();

      // Fetch existing tasks
      const { data, error } = await supabaseClient.from('tasks').select('*').order('id', { ascending: false });
      if (!error && data) {
        tasks = data;
        renderTasks();
      }

      // Subscribe to real-time changes
      supabaseClient
        .channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, async () => {
          const { data: updatedData } = await supabaseClient.from('tasks').select('*').order('id', { ascending: false });
          if (updatedData) {
            tasks = updatedData;
            renderTasks();
          }
        })
        .subscribe();
    }

    function openModal(editId = null) {
      document.getElementById('task-form').reset();
      document.getElementById('task-id').value = '';
      document.getElementById('modal-title').innerText = 'Add New Architecture Task';

      if (editId) {
        const task = tasks.find(t => t.id === editId);
        if (task) {
          document.getElementById('modal-title').innerText = 'Edit Task / Deliverable';
          document.getElementById('task-id').value = task.id;
          document.getElementById('project-name').value = task.project;
          document.getElementById('project-phase').value = task.phase;
          document.getElementById('task-title').value = task.title;
          document.getElementById('assignee-name').value = task.assignee;
          document.getElementById('assignee-role').value = task.role;
          document.getElementById('task-deadline').value = task.deadline;
          document.getElementById('task-status').value = task.status;
          document.getElementById('task-link').value = task.link || '';
        }
      }
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    async function saveTask(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Saving...';

      const id = document.getElementById('task-id').value;
      const payload = {
        project: document.getElementById('project-name').value,
        phase: document.getElementById('project-phase').value,
        title: document.getElementById('task-title').value,
        assignee: document.getElementById('assignee-name').value,
        role: document.getElementById('assignee-role').value,
        deadline: document.getElementById('task-deadline').value,
        status: document.getElementById('task-status').value,
        link: document.getElementById('task-link').value
      };

      if (id) {
        await supabaseClient.from('tasks').update(payload).eq('id', id);
      } else {
        await supabaseClient.from('tasks').insert([payload]);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = 'Save Deliverable';
      closeModal();
    }

    async function deleteTask(id) {
      if (confirm('Are you sure you want to delete this task from project tracking?')) {
        await supabaseClient.from('tasks').delete().eq('id', id);
      }
    }

    function renderTasks() {
      const tbody = document.getElementById('task-list');
      const search = document.getElementById('filter-search').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      const roleFilter = document.getElementById('filter-role').value;

      tbody.innerHTML = '';
      const todayStr = new Date().toISOString().split('T')[0];

      let filtered = tasks.filter(t => {
        const matchesSearch = t.project.toLowerCase().includes(search) || t.title.toLowerCase().includes(search) || t.assignee.toLowerCase().includes(search);
        const matchesStatus = statusFilter === 'ALL' || t.status === statusFilter;
        const matchesRole = roleFilter === 'ALL' || t.role === roleFilter;
        return matchesSearch && matchesStatus && matchesRole;
      });

      // Update Header Stats
      document.getElementById('stat-total').innerText = tasks.length;
      document.getElementById('stat-progress').innerText = tasks.filter(t => t.status === 'In Progress').length;
      document.getElementById('stat-completed').innerText = tasks.filter(t => t.status === 'Closed').length;
      document.getElementById('stat-overdue').innerText = tasks.filter(t => t.deadline < todayStr && t.status !== 'Closed').length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-[#5E6C84]">No deliverables found. Click "+ New Task" to add your first project drawing or task.</td></tr>`;
        return;
      }

      filtered.forEach(task => {
        const isOverdue = task.deadline < todayStr && task.status !== 'Closed';
        
        let statusBadge = '';
        switch(task.status) {
          case 'Closed': statusBadge = 'bg-[#E3FCEF] text-[#006644] border-[#ABF5D1]'; break;
          case 'In Progress': statusBadge = 'bg-[#DEEBFF] text-[#0747A6] border-[#B3D4FF]'; break;
          case 'Client Review': statusBadge = 'bg-[#EAE6FF] text-[#403294] border-[#C0B6F2]'; break;
          case 'Revision Needed': statusBadge = 'bg-[#FFFAE6] text-[#FF8B00] border-[#FFF0B3]'; break;
          default: statusBadge = 'bg-[#F4F5F7] text-[#42526E] border-[#DFE1E6]';
        }

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-[#FAFBFC] transition-colors';
        tr.innerHTML = `
          <td class="p-3.5">
            <div class="font-bold text-[#091E42]">${task.project}</div>
            <div class="text-xs text-[#5E6C84] flex items-center gap-2 mt-0.5">
              <span>${task.title}</span>
              ${task.link ? `<a href="${task.link}" target="_blank" class="text-[#0052CC] hover:underline inline-flex items-center gap-1 font-medium"><i class="fa-solid fa-paperclip text-[10px]"></i> Link</a>` : ''}
            </div>
          </td>
          <td class="p-3.5">
            <div class="font-semibold text-[#172B4D]">${task.assignee}</div>
            <div class="text-xs text-[#5E6C84]">${task.role}</div>
          </td>
          <td class="p-3.5">
            <span class="text-xs bg-[#F4F5F7] border border-[#DFE1E6] px-2 py-0.5 rounded text-[#42526E] font-medium">${task.phase}</span>
          </td>
          <td class="p-3.5">
            <div class="${isOverdue ? 'text-[#DE350B] font-bold' : 'text-[#172B4D]'} text-xs">
              ${task.deadline} ${isOverdue ? '<i class="fa-solid fa-triangle-exclamation ml-1" title="Overdue"></i>' : ''}
            </div>
          </td>
          <td class="p-3.5">
            <span class="text-xs px-2.5 py-0.5 rounded-full border ${statusBadge} font-semibold">${task.status}</span>
          </td>
          <td class="p-3.5 text-right space-x-2">
            <button onclick="openModal(${task.id})" class="text-[#6B778C] hover:text-[#0052CC] p-1" title="Edit Task"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteTask(${task.id})" class="text-[#6B778C] hover:text-[#DE350B] p-1" title="Delete Task"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initialize App
    initRealtimeData();
  </script>
</body>
</html>
